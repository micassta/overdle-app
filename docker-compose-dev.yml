services:
  database:
    image: mysql:8.0
    ports:
      - "3307:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: overdle
      MYSQL_DATABASE: overdle_database
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - overdle-net

  frontend:
    build:
      context: ./overdle-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    networks:
      - overdle-net
    # Forzamos el comando aquí para asegurarnos que NO use flags raras
    command: npm run dev
    # ESTA ES LA NUEVA SOLUCIÓN (Docker File Sync)
    develop:
      watch:
        - action: sync
          path: ./overdle-frontend
          target: /overdle
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./overdle-frontend/package.json

  backend:
    build:
      context: ./overdle-backend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    depends_on:
      - database
    networks:
      - overdle-net
    # Forzamos el comando Legacy aquí directamente
    #command: /bin/sh -c "npx prisma generate && nodemon -L index.js"
    # ESTA ES LA NUEVA SOLUCIÓN (Docker File Sync)
    develop:
      watch:
        - action: sync
          path: ./overdle-backend
          target: /home/overdle
          ignore:
            - node_modules/
        - action: rebuild
          path: ./overdle-backend/package.json

networks:
  overdle-net:
    driver: bridge

volumes:
  mysql-data:

